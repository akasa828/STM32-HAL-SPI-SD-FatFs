name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cppcheck
      - name: Configure host tests
        run: cmake -S tests -B build/host -G Ninja
      - name: Build host tests
        run: cmake --build build/host
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Run static analysis
        run: >-
          cppcheck --enable=warning,performance,portability --std=c11
          --error-exitcode=1 --suppress=missingIncludeSystem
          -I Core/Micro_SD -I Core/fatfs -I Core/Port
          Core/Micro_SD/SD_reader.c Core/fatfs/diskio.c
          Core/Port/sd_stm32_hal.c

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi ninja-build
      - name: Configure firmware
        run: cmake --preset ${{ matrix.build_type }} -B build/firmware-${{ matrix.build_type }}
      - name: Build firmware
        run: cmake --build build/firmware-${{ matrix.build_type }}
